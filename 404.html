<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting - OnSceneLaw</title>
    <script>
        // This script catches GitHub Pages 404 routing for subpages/tokens 
        // and safely forwards them to the correct file while preserving hash parameters.
        const pathSegmentsToKeep = 0; // Adjust if your repo is in a subfolder (e.g. /repo-name/ is 1)
        const l = window.location;
        
        // If the path was directed to reset-password or contains tokens, route accordingly
        let targetPage = 'reset-password.html';
        if (l.pathname.includes('reset-password')) {
            targetPage = 'reset-password.html';
        }

        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/' + targetPage +
            l.search + l.hash
        );
    </script>
</head>
<body>
</body>
</html>
