<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - OnSceneLaw</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center px-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-white">Reset Your Password</h1>
            <p class="text-sm text-slate-400 mt-1">Enter your new secure password below.</p>
        </div>

        <form id="reset-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">New Password</label>
                <input type="password" id="new-password" required minlength="6" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
            </div>
            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-3 rounded-lg transition-colors shadow-lg shadow-cyan-900/20">
                Update Password
            </button>
        </form>

        <div id="message" class="mt-4 text-center text-sm hidden"></div>
    </div>

    <script>
        // Initialize Supabase client
        const supabaseUrl = 'https://bhrsaugshxcjjkrzotii.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJocnNhdWdzaHhjamprcnpvdGlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MjQzOTAsImV4cCI6MjEwODUwMDM5MH0.bXPyyxx_s_PEKjzHVCk4I-Kx4pB-vPMOB-buNf0jlTM';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const form = document.getElementById('reset-form');
        const messageDiv = document.getElementById('message');
        const submitBtn = form.querySelector('button[type="submit"]');

        // Disable submit button until session is verified
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

        window.addEventListener('DOMContentLoaded', async () => {
            messageDiv.classList.remove('hidden');
            messageDiv.className = 'mt-4 text-center text-sm text-slate-400';
            messageDiv.textContent = 'Verifying recovery link...';

            const hash = window.location.hash;
            const searchParams = new URLSearchParams(window.location.search);
            
            // Check if we have a token_hash or access_token in the URL
            let accessToken = null;
            let refreshToken = null;

            if (hash && hash.includes('access_token')) {
                const params = new URLSearchParams(hash.substring(1));
                accessToken = params.get('access_token');
                refreshToken = params.get('refresh_token');
            } else if (searchParams.has('access_token')) {
                accessToken = searchParams.get('access_token');
                refreshToken = searchParams.get('refresh_token');
            }

            if (accessToken) {
                // Manually set the session using the tokens from the URL
                const { error: sessionError } = await _supabase.auth.setSession({
                    access_token: accessToken,
                    refresh_token: refreshToken
                });

                if (sessionError) {
                    messageDiv.className = 'mt-4 text-center text-sm text-red-400';
                    messageDiv.textContent = 'Session error: ' + sessionError.message;
                    return;
                }
            }

            // Check code parameter if PKCE is used
            const code = searchParams.get('code');
            if (code) {
                const { error: codeError } = await _supabase.auth.exchangeCodeForSession(code);
                if (codeError) {
                    messageDiv.className = 'mt-4 text-center text-sm text-red-400';
                    messageDiv.textContent = 'Verification error: ' + codeError.message;
                    return;
                }
            }

            // Final check to see if an active session now exists
            const { data: { session }, error: getSessionError } = await _supabase.auth.getSession();
            
            if (session) {
                messageDiv.className = 'mt-4 text-center text-sm text-cyan-400';
                messageDiv.textContent = 'Session verified. Please enter your new password below.';
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                messageDiv.className = 'mt-4 text-center text-sm text-amber-400';
                messageDiv.textContent = 'No active recovery session detected. Please request a new password reset link.';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('new-password').value;
            
            const { error } = await _supabase.auth.updateUser({ password: password });

            messageDiv.classList.remove('hidden');
            if (error) {
                messageDiv.className = 'mt-4 text-center text-sm text-red-400';
                messageDiv.textContent = error.message;
            } else {
                messageDiv.className = 'mt-4 text-center text-sm text-emerald-400';
                messageDiv.textContent = 'Password successfully updated! You can now return to the app.';
                form.reset();
                submitBtn.disabled = true;
            }
        });
    </script>
</body>
</html>
