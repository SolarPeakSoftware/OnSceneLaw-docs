<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | OnSceneLaw</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      background-color: rgba(16, 185, 129, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
    }
    .icon svg { width: 36px; height: 36px; stroke: #10b981; }
    h1 { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 10px; }
    p { font-size: 14px; color: #9ca3af; line-height: 1.5; margin-bottom: 24px; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #0284c7; }
    button {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    .hidden { display: none !important; }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      background-color: #1e293b;
      color: #38bdf8;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Default View: Confirmation Page -->
  <div id="confirm-view" class="container">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>
    <h1>Email Confirmed</h1>
    <p>Your <strong>OnSceneLaw</strong> account has been verified. You can close this browser window and open the app to sign in.</p>
    <div class="badge">Ready for Sign In</div>
  </div>

  <!-- Reset Password View -->
  <div id="reset-view" class="container hidden">
    <h1>Set New Password</h1>
    <p>Enter a new password for your <strong>OnSceneLaw</strong> account.</p>
    <input type="password" id="new-password" placeholder="New Password (min 6 chars)" />
    <button id="reset-btn">Update Password</button>
    <p id="status-msg" style="margin-top:15px; font-size:13px;"></p>
  </div>

  <script>
    // 1. Initialize Supabase
    const SUPABASE_URL = https://bhrsaugshxcjjkrzotii.supabase.co;
    const SUPABASE_ANON_KEY = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJocnNhdWdzaHhjamprcnpvdGlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MjQzOTAsImV4cCI6MjEwODUwMDM5MH0.bXPyyxx_s_PEKjzHVCk4I-Kx4pB-vPMOB-buNf0jlTM;
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Detect PKCE code or recovery flags in URL
    const fullUrl = window.location.href;
    const searchParams = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(window.location.hash.substring(1));

    const isRecoveryFlow = 
      fullUrl.includes('type=recovery') || 
      searchParams.has('code') || 
      searchParams.has('token_hash') ||
      hashParams.has('access_token');

    if (isRecoveryFlow) {
      document.getElementById('confirm-view').classList.add('hidden');
      document.getElementById('reset-view').classList.remove('hidden');

      // If it's a PKCE code flow, exchange it immediately to establish the recovery session
      if (searchParams.has('code')) {
        supabaseClient.auth.exchangeCodeForSession(fullUrl).catch(err => {
          console.error("Session exchange error:", err);
        });
      }
    }

    // 3. Password reset submission logic
    document.getElementById('reset-btn').addEventListener('click', async () => {
      const newPassword = document.getElementById('new-password').value;
      const statusMsg = document.getElementById('status-msg');

      if (!newPassword || newPassword.length < 6) {
        statusMsg.style.color = '#ef4444';
        statusMsg.innerText = 'Password must be at least 6 characters.';
        return;
      }

      statusMsg.style.color = '#9ca3af';
      statusMsg.innerText = 'Updating password...';

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

      if (error) {
        statusMsg.style.color = '#ef4444';
        statusMsg.innerText = error.message;
      } else {
        statusMsg.style.color = '#10b981';
        statusMsg.innerText = 'Password updated! Open OnSceneLaw and sign in with your new password.';
      }
    });
  </script>

</body>
</html>
